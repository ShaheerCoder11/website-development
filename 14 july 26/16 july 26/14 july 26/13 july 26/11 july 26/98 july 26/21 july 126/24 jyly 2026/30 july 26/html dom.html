<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Zoo</title>
</head>
<body>
    <h1>My Zoo</h1>
    <p>Use javascript and the dom to add animals to each cage.</p>
    <div id="zoo">
        <div class="zone">Zone1:<span id="zone1"></span></div>
        <div class="zone">Zone2:<span id="zone2"></span></div>
        <div class="zone">Zone3:<span id="zone3"></span></div>
        <div class="zone">Toatal Animals : <span id="Total"></span></div>
    </div>
    <button onclick="openzoo()">Open the zoo</button>
    <p id="status"></p>
    <script>
        function openzoo(){
            document.getElementById("zone1").innerHTML="Lion";
            document.getElementById("zone2").innerHTML="Elephant";
            document.getElementById("zone3").innerHTML="Zebra";
            document.getElementById("Total").innerHTML="3";
            document.getElementById("zoo").style.backgroundColor="Aqua";
            document.getElementById("status").innerHTML=document.title+"is now open"
        }
    </script>
</body>
</html>
